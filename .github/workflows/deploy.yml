name: UniCore Enterprise ERP CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # Lint & Automated Testing
  # ─────────────────────────────────────────────
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint --if-present

      - name: Production Bundle Build (Vite)
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Container Security & Docker Build
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Image Build & Verification
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: unicore/frontend:latest

      - name: Build Backend API Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.api
          push: false
          tags: unicore/api:latest

  # ─────────────────────────────────────────────
  # Production Deploy Stage (Staging / Production)
  # ─────────────────────────────────────────────
  deploy:
    name: Zero-Downtime Deployment
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Notification
        run: echo "Initiating blue-green rolling deployment to Kubernetes cluster..."
