version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL (Multi-tenant DB with Row-Level Security)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: unicore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unicore_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unicore_secret}
      POSTGRES_DB: unicore_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicore_admin -d unicore_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unicore_net

  # ─────────────────────────────────────────────
  # Redis (Session cache, job queues, rate limiting)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: unicore_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - unicore_net

  # ─────────────────────────────────────────────
  # Node.js API Server (Express + Prisma)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    container_name: unicore_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://unicore_admin:${DB_PASSWORD:-unicore_secret}@postgres:5432/unicore_erp
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_refresh_secret_here}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unicore_net

  # ─────────────────────────────────────────────
  # React Frontend (Nginx static serving)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unicore_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - unicore_net

  # ─────────────────────────────────────────────
  # AI Microservice (Python FastAPI — ML models)
  # ─────────────────────────────────────────────
  ai_service:
    image: unicore/ai-service:latest
    build:
      context: ./ai
      dockerfile: Dockerfile.ai
    container_name: unicore_ai
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MODEL_PATH: /app/models
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    volumes:
      - ai_models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - unicore_net

volumes:
  postgres_data:
  redis_data:
  ai_models:

networks:
  unicore_net:
    driver: bridge
